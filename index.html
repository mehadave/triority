<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Triority</title>
    <meta
      name="description"
      content="Pick three priorities a day. Finish all three, win the day."
    />
    <meta name="theme-color" content="#1A1A1A" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Triority" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/pwa-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/pwa-16x16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
  </head>
  <body>
    <!-- Loading screen. Plain SVG + CSS so it draws before the app script arrives. -->
    <div id="splash" aria-hidden="true">
      <div class="splash-row">
        <svg class="splash-ring" width="56" height="56" viewBox="0 0 46 46">
          <path
            pathLength="1"
            d="M23.5 4.2C34.1 3.6 42.4 11.8 42 22.9C41.6 33.6 33.2 42.1 22.6 41.8C12.1 41.5 4.1 33.2 4.4 22.4C4.7 12.3 12.2 4.9 21.4 4.6C23.8 4.5 25.6 5 26.9 5.8"
          />
        </svg>
        <svg class="splash-ring" width="56" height="56" viewBox="0 0 46 46">
          <path
            pathLength="1"
            d="M20.8 5.1C31.6 3.2 41.9 10.4 42.6 21.7C43.2 32.9 35.1 41.6 23.9 42.2C13.3 42.7 4.6 35.4 3.9 24.6C3.3 14.1 10.1 6.6 19.2 5C21.4 4.6 23.3 4.9 24.4 5.6"
          />
        </svg>
        <div class="splash-bloom">
          <svg class="splash-ring" width="56" height="56" viewBox="0 0 46 46">
            <path
              pathLength="1"
              d="M25.9 4.9C36.2 6.1 42.9 14.2 41.8 24.6C40.8 34.3 32.4 41.9 22.1 41.3C11.4 40.7 4.2 32.1 5 21.5C5.8 11.6 13.7 4.3 23.4 4.1C26.2 4 28.1 5.3 28.8 6.4"
            />
          </svg>
          <picture>
            <source type="image/avif" srcset="/img/sunflower-256.avif" />
            <img
              class="splash-flower"
              src="/img/sunflower-256.webp"
              alt=""
              width="96"
              height="96"
              fetchpriority="high"
            />
          </picture>
          <svg class="splash-tick" width="46" height="46" viewBox="0 0 46 46">
            <path
              pathLength="1"
              d="M12.5 24.2C15.2 26.4 17.4 29.1 19.6 32.4C23.9 23.6 29.8 15.9 37.6 9.8"
            />
          </svg>
        </div>
      </div>
      <p class="splash-word">Triority</p>
      <p class="splash-tag">3 priorities. every day.</p>
    </div>
    <div id="root"></div>
    <noscript>Triority needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
